id = "swls"
name = "SWLS"
description = "Semantic Web Language Server for Turtle, TriG, SPARQL and JSON-LD — autocompletion, diagnostics, formatting and more."
version = "0.0.1"
schema_version = 1
authors = ["Arthur Vercruysse"]
repository = "https://github.com/SemanticWebLanguageServer/swls"

[language_servers.swls]
name = "SWLS"
languages = ["Turtle", "TriG", "SPARQL"]

[language_servers.swls.language_ids]
"Turtle" = "turtle"
"TriG" = "trig"
"SPARQL" = "sparql"

[grammars.turtle]
repository = "https://github.com/GordianDziwis/tree-sitter-turtle"
rev = "7f789ea7ef765080f71a298fc96b7c957fa24422"

[grammars.sparql]
repository = "https://github.com/GordianDziwis/tree-sitter-sparql"
rev = "1ef52d35a73a2a5f2e433ecfd1c751c1360a923b"
