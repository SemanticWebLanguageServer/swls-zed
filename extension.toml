id = "semantic-web"
name = "Semantic Web"
description = "Turtle, TriG, SPARQL and JSON-LD support powered by the Semantic Web Language Server (SWLS): completion, diagnostics, formatting and more."
version = "0.1.0"
schema_version = 1
authors = ["Arthur Vercruysse"]
repository = "https://github.com/SemanticWebLanguageServer/swls-zed"

# Turtle and TriG share one grammar: tree-sitter-turtle implements the TriG
# superset (named graphs), which is also valid for plain Turtle documents.
[grammars.turtle]
repository = "https://github.com/GordianDziwis/tree-sitter-turtle"
rev = "7f789ea7ef765080f71a298fc96b7c957fa24422"

[grammars.sparql]
repository = "https://github.com/GordianDziwis/tree-sitter-sparql"
rev = "1ef52d35a73a2a5f2e433ecfd1c751c1360a923b"

# JSON-LD is JSON; Zed prefers its built-in JSON grammar when one is registered.
[grammars.json]
repository = "https://github.com/tree-sitter/tree-sitter-json"
rev = "254c42a6476413b776221e03982ac8ae159eeb72"

[language_servers.swls]
name = "SWLS"
languages = ["Turtle", "TriG", "JSON-LD", "SPARQL"]

[language_servers.swls.language_ids]
"Turtle" = "turtle"
"TriG" = "trig"
"JSON-LD" = "jsonld"
"SPARQL" = "sparql"
