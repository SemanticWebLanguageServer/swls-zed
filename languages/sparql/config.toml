name = "SPARQL"
grammar = "sparql"
path_suffixes = ["sq", "rq", "sparql"]
line_comments = ["# "]
brackets = [
    { start = "<", end = ">", close = true, newline = false },
    { start = "{", end = "}", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false },
    { start = "'", end = "'", close = true, newline = false },
]
